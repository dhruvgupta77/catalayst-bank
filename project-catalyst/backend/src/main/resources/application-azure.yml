# Azure OpenAI as the primary LLM provider. Requires AZURE_OPENAI_API_KEY and AZURE_OPENAI_ENDPOINT.
spring:
  ai:
    model:
      chat: azure-openai
    azure:
      openai:
        api-key: ${AZURE_OPENAI_API_KEY}
        endpoint: ${AZURE_OPENAI_ENDPOINT}
        chat:
          options:
            deployment-name: ${AZURE_OPENAI_DEPLOYMENT:gpt-4o}
            temperature: 0.2
catalyst:
  ai-mode: llm
